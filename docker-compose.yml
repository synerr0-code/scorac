# version: '3.8'

services:
  backend:
    build: 
      context: .
    container_name: scorac_backend_local
    env_file: 
      - .env
    volumes:
      - ./sqlite_data:/app/data
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
    container_name: scorac_frontend_local
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy_local
    ports:
      - "8080:80" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge