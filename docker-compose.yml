

services:
  backend:
    image: synerr0/scorac-backend:latest
    build: 
      context: .
    container_name: scorac_backend_prod
    env_file: 
      - .env
    volumes:
      - ./sqlite_data:/app/data
    networks:
      - app-network
    restart: always

  frontend:
    image: synerr0/scorac-frontend:latest
    build: 
      context: ./frontend
    container_name: scorac_frontend_prod
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge